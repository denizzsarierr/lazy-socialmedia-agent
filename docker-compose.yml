services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: instagram-agent-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./generated:/app/generated
    depends_on:
      - postgres
      - redis
    networks:
      - instagram-agent-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: instagram-agent-worker

    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - ./backend:/app
      - ./generated:/app/generated

    depends_on:
      - postgres
      - redis

    command: rq worker publish --with-scheduler

    networks:
      - instagram-agent-network
  
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: instagram-agent-scheduler

    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - ./backend:/app
      - ./generated:/app/generated

    depends_on:
      - postgres
      - redis

    command: python -c "from app.scheduler import scheduler_loop; scheduler_loop()"

    networks:
      - instagram-agent-network

  postgres:
    image: postgres:17
    container_name: instagram-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - instagram-agent-network

  redis:
    image: redis:7-alpine
    container_name: instagram-agent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - instagram-agent-network

volumes:
  postgres_data:
  redis_data:

networks:
  instagram-agent-network:
    driver: bridge